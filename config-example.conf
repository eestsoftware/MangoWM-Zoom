# Screen zoom settings
# Add these lines to your mango config.conf

# Max zoom level (1.0 - 20.0, default 4.0)
zoom_max=4.0

# Zoom step per scroll tick (0.01 - 5.0, default 0.2)
zoom_speed=0.2

# Scroll wheel zoom: Super + scroll up/down
axisbind=SUPER,UP,screen_zoom_in
axisbind=SUPER,DOWN,screen_zoom_out

# Reset zoom back to 1x
bind=SUPER,0,screen_zoom_reset

# Jump to a specific zoom level (optional)
# bind=SUPER,equal,screen_zoom_set,2.0
